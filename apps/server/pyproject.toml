[project]
name = "sourcelens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devkrsna", email = "krishnagavali973@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.142.2",
    "langchain-sarvam>=0.1.2",
    "langgraph>=1.2.12",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
sourcelens = "sourcelens.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
